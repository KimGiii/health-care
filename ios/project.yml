name: HealthCare
options:
  bundleIdPrefix: com.kingloo.gainsy
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Debug
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  groupSortPosition: none

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_NAME: HealthCare
    DEVELOPMENT_TEAM: HVVJG5AF82
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

configs:
  Debug: debug
  Staging: debug
  Release: release

configFiles:
  Debug: Configs/Debug.xcconfig
  Staging: Configs/Staging.xcconfig
  Release: Configs/Release.xcconfig

packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    # 11.15.0의 GoogleAppMeasurementOnDeviceConversion 바이너리 아티팩트가 깨져 있어 11.14.0에 핀.
    # 업그레이드 시 SPM resolve 검증 후 풀 것.
    exactVersion: "11.14.0"
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"

targets:
  HealthCare:
    type: application
    platform: iOS
    sources:
      - path: HealthCare
        excludes:
          - "**/*.md"
    info:
      path: HealthCare/Resources/Info.plist
      properties:
        CFBundleDisplayName: gainsy
        CFBundleIdentifier: com.kingloo.gainsy.ios
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: SplashBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: "진행 사진을 찍기 위해 카메라 접근 권한이 필요합니다."
        NSPhotoLibraryUsageDescription: "진행 사진을 저장하기 위해 사진 라이브러리 접근 권한이 필요합니다."
        NSUserNotificationUsageDescription: "주간 건강 요약 및 목표 달성 알림을 받습니다."
        UIBackgroundModes:
          - remote-notification
        FirebaseAppDelegateProxyEnabled: false
        ITSAppUsesNonExemptEncryption: false
        API_BASE_URL: "$(BASE_URL)"
        GADApplicationIdentifier: "ca-app-pub-6600084915621974~8422643430"
        NSUserTrackingUsageDescription: "맞춤 광고를 보여드리기 위해 광고 추적 권한을 요청합니다. 거부하셔도 광고는 표시되지만 관련성이 낮을 수 있습니다."
        NSLocalNetworkUsageDescription: "개발 중 Mac에서 실행 중인 로컬 API 서버에 연결하기 위해 로컬 네트워크 접근이 필요합니다."
    settings:
      base:
        INFOPLIST_FILE: HealthCare/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kingloo.gainsy.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: FirebaseSDK
        product: FirebaseAnalytics
      - package: FirebaseSDK
        product: FirebaseMessaging
      - package: GoogleMobileAds
        product: GoogleMobileAds
    scheme:
      testTargets:
        - HealthCareTests
        - HealthCareUITests

  HealthCareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthCareTests
    dependencies:
      - target: HealthCare
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_MODULE_NAME: HealthCareTests
        PRODUCT_BUNDLE_IDENTIFIER: com.kingloo.gainsy.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  HealthCareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HealthCareUITests
    dependencies:
      - target: HealthCare
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_MODULE_NAME: HealthCareUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.kingloo.gainsy.ios.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HealthCare:
    build:
      targets:
        HealthCare: all
        HealthCareTests: [test]
        HealthCareUITests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: BASE_URL
          value: https://api.gainsy.site
          isEnabled: true
    test:
      config: Debug
      targets:
        - name: HealthCareTests
          randomExecutionOrder: true
        - name: HealthCareUITests
          randomExecutionOrder: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HealthCare-Staging:
    build:
      targets:
        HealthCare: all
    run:
      config: Staging
      environmentVariables:
        - variable: BASE_URL
          value: https://api.gainsy.site
          isEnabled: true
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Release
