    entitlements:
      path: HealthCare/HealthCare.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.kingloo.gainsy.widgets
        aps-environment: development
    settings:
      base:
        INFOPLIST_FILE: HealthCare/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kingloo.gainsy.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: FirebaseSDK
        product: FirebaseAnalytics
      - package: FirebaseSDK
        product: FirebaseMessaging
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: HealthCareWidgetExtension
        embed: true
        codeSign: true
    scheme:
      gatherCoverageData: true
      testTargets:
        - HealthCareTests
        - HealthCareUITests

  HealthCareWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: HealthCareWidget
        excludes:
          - "**/*.md"
      - path: HealthCare/Core/Widget
        excludes:
          - "**/*.md"
          - "GoalWidgetSnapshotPublisher.swift"
    info:
      path: HealthCareWidget/Info.plist
      properties:
        CFBundleDisplayName: HealthCareWidget
        CFBundleIdentifier: com.kingloo.gainsy.ios.HealthCareWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: HealthCareWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kingloo.gainsy.widgets
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        INFOPLIST_FILE: HealthCareWidget/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.kingloo.gainsy.ios.HealthCareWidget
        PRODUCT_NAME: "$(TARGET_NAME)"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  HealthCareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HealthCareTests
    dependencies:
      - target: HealthCare
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_MODULE_NAME: HealthCareTests
        PRODUCT_BUNDLE_IDENTIFIER: com.kingloo.gainsy.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  HealthCareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HealthCareUITests
    dependencies:
      - target: HealthCare
    settings:
      base:
        PRODUCT_NAME: "$(TARGET_NAME)"
        PRODUCT_MODULE_NAME: HealthCareUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.kingloo.gainsy.ios.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HealthCare:
    build:
      targets:
        HealthCare: all
        HealthCareTests: [test]
        HealthCareUITests: [test]
    run:
      # BASE_URL은 Debug.xcconfig(localhost/LAN) → Info.plist $(BASE_URL)로 주입.
      # env 변수로 덮어쓰지 않는다 (덮어쓰면 xcconfig 환경 분리가 무력화됨).
      config: Debug
    test:
      config: Debug
      targets:
        - name: HealthCareTests
          randomExecutionOrder: true
        - name: HealthCareUITests
          randomExecutionOrder: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  HealthCare-Staging:
    build:
      targets:
        HealthCare: all
    run:
      # BASE_URL은 Staging.xcconfig(dev.api.gainsy.site) → Info.plist $(BASE_URL)로 주입.
      # env 변수로 덮어쓰지 않는다 (이전에 prod URL이 박혀 dev 분리가 깨졌던 버그).
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Release
