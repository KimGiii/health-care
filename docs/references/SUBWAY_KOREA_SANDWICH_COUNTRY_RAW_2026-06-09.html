<!DOCTYPE html>

<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>SUBWAY - 원산지정보 팝업</title>
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
	<meta content="" name="description" />
	<link href="" rel="shortcut icon" type="image/x-icon" />
	<link href="../css/ui.common.css" rel="stylesheet" type="text/css" />
	<link href="../css/jquery.mCustomScrollbar.min.css" rel="stylesheet" type="text/css" />
	<script src="../js/jquery/jquery-1.11.3.min.js" type="text/javascript"></script>
	<script src="../js/jquery/jquery.mCustomScrollbar.concat.min.js" type="text/javascript"></script>
	<script src="../js/jquery/TweenMax.min.js" type="text/javascript"></script>
</head>

<link href="../css/ui.popup.css" rel="stylesheet" type="text/css" /><!-- 팝업 css -->
<body>
	<div id="popup_wrap">
		<h1 class="title">원산지정보</h1>
		<div class="popup_content">
			<div class="country_origin_wrapper">
				<ul>
					<li>
						<div class="icon">
							<img alt="쇠고기" src="../images/menu/icon_country_origin01.png" />
							<span>쇠고기</span>
						</div>
						<div class="info">
							<dl>
								<dt>스테이크 (미국산), 안창 비프 (호주산)</dt>
							</dl>
						</div>
					</li>
					<li>
						<div class="icon">
							<img alt="쇠고기" src="../images/menu/icon_country_origin02.png" />
							<span>돼지고기</span>
						</div>
						<div class="info">
							<dl>
								<dt>베이컨, 베이컨비츠, 살라미, 페퍼로니, 풀드포크(미국산), 햄(국내산과 외국산 섞음), 잠봉(국내산)</dt>
							</dl>
						</div>
					</li>
					<li>
						<div class="icon">
							<img alt="닭고기" src="../images/menu/icon_country_origin03.png" />
							<span>닭고기</span>
						</div>
						<div class="info">
							<dl>
								<dt>로테세리 치킨 (국내산과 외국산 섞음), 치킨 스트립, 치킨브레스트 (국내산)</dt>
							</dl>
						</div>
					</li>
					<li>
						<div class="icon">
							<img alt="참치" src="../images/menu/icon_country_origin06.png" />
							<span>참치</span>
						</div>
						<div class="info">
							<dl>
								<dt>참치(태국산)</dt>
							</dl>
						</div>
					</li>
				</ul>
			</div>
		</div>
	</div>
	<script>
        $(document).ready(function(){
            $('#popup_wrap .scrollwrapper').mCustomScrollbar();
        })
	</script>


</body></html>
