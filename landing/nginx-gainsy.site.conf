# /etc/nginx/sites-available/gainsy.site
# apex 도메인(gainsy.site)용 정적 랜딩 페이지 + app-ads.txt 서빙.
# api 서브도메인은 별도 server 블록(Spring Boot 프록시) 그대로 유지.

server {
    listen 80;
    listen [::]:80;
    server_name gainsy.site www.gainsy.site;

    # certbot이 ACME challenge 처리 후 443으로 리다이렉트하도록 설정함.
    # certbot --nginx 실행 시 이 server 블록이 자동으로 SSL 블록과 함께 갱신됨.
    location / {
        return 301 https://gainsy.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gainsy.site www.gainsy.site;

    # SSL 인증서 — certbot --nginx 실행 시 자동 주입됨.
    # ssl_certificate /etc/letsencrypt/live/gainsy.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gainsy.site/privkey.pem;

    # www → apex 리다이렉트
    if ($host = www.gainsy.site) {
        return 301 https://gainsy.site$request_uri;
    }

    root /var/www/gainsy;
    index index.html;

    # app-ads.txt — text/plain 명시
    location = /app-ads.txt {
        default_type text/plain;
        try_files /app-ads.txt =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 보안 헤더
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 정적 자산 캐시
    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
