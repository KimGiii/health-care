name: Deploy dev backend

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: healthcare-api
  IMAGE_TAG: dev-${{ github.sha }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: healthcare_test
          POSTGRES_USER: healthcare
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: healthcare_test
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: test_password
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-key-for-ci-min-32-chars-required
      S3_ENDPOINT: ""
      S3_BUCKET: healthcare-photos-test
      S3_PATH_STYLE_ACCESS: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  deploy:
    name: Build & Deploy to dev sidecar (port 8084)
    runs-on: ubuntu-latest
    needs: test
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push Docker image
        working-directory: backend
        run: |
          ECR_REGISTRY=${{ steps.ecr-login.outputs.registry }}
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag  $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                      $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:dev-latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy dev container (port 8084)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -euo pipefail

            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ steps.ecr-login.outputs.registry }}

            docker pull ${{ env.IMAGE }}

            # 기존 dev 컨테이너 교체 (있으면)
            docker stop healthcare-api-dev || true
            docker rm   healthcare-api-dev || true

            # Docker Compose로 띄운 postgres/redis 네트워크 이름 감지
            COMPOSE_NETWORK=$(docker network ls --format '{{.Name}}' \
              | grep "healthcare-dev" | head -1 || echo "")

            docker run -d \
              --name healthcare-api-dev \
              --restart unless-stopped \
              --memory 500m \
              --memory-swap 1500m \
              -p 8084:8080 \
              ${COMPOSE_NETWORK:+--network $COMPOSE_NETWORK} \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e JAVA_OPTS="-Xmx400m -Xms256m" \
              -e DB_URL="jdbc:postgresql://postgres:5432/healthcare_dev" \
              -e DB_USERNAME="healthcare" \
              -e DB_PASSWORD="${{ secrets.DEV_DB_PASSWORD }}" \
              -e REDIS_HOST="redis" \
              -e REDIS_PORT="6379" \
              -e JWT_SECRET="${{ secrets.DEV_JWT_SECRET }}" \
              -e S3_BUCKET="${{ secrets.DEV_S3_BUCKET }}" \
              -e FCM_CREDENTIALS_PATH="/app/fcm-credentials.json" \
              -e OPENAI_API_KEY="${{ secrets.DEV_OPENAI_API_KEY }}" \
              -e PUBLIC_FOOD_API_KEY="${{ secrets.DEV_PUBLIC_FOOD_API_KEY }}" \
              -e APPLE_BUNDLE_ID="com.kingloo.gainsy.ios" \
              -v /etc/healthcare-dev/fcm-credentials.json:/app/fcm-credentials.json:ro \
              ${{ env.IMAGE }}

            # 헬스체크
            for i in $(seq 1 18); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                http://localhost:8084/actuator/health 2>/dev/null || true)
              if [ "$STATUS" = "200" ]; then
                echo "Dev container healthy on port 8084"
                docker image prune -f
                exit 0
              fi
              echo "Attempt $i: status=$STATUS, retrying in 10s..."
              sleep 10
            done

            echo "Dev container failed health check"
            docker logs healthcare-api-dev --tail 50 || true
            exit 1

      - name: Verify dev external health
        run: |
          set -euo pipefail
          for i in $(seq 1 6); do
            STATUS=$(curl -4 -sS -o /dev/null -w "%{http_code}" --max-time 10 \
              https://dev.api.gainsy.site/actuator/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Dev external health OK"
              exit 0
            fi
            echo "Attempt $i: $STATUS"
            sleep 10
          done
          echo "Dev health check failed"
          exit 1
